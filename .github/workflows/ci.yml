name: Skills Registry CLI quality
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-23
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified 2026-10-23
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build and test offline CLI
        run: npm test
